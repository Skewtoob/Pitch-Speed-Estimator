[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchspeed"
version = "0.1.0"
description = "Estimate baseball pitch speeds from (old, interlaced, low-quality) video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "av>=12",
    "imageio-ffmpeg>=0.5",
    "opencv-python>=4.8",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pitchspeed = "pitchspeed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pitchspeed.render" = ["fonts/*.otf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running end-to-end tests (deselect with -m 'not slow')",
    "gui: needs a display (Xvfb) and opencv-python with highgui",
]
