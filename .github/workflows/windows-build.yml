name: Windows program

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build PitchSpeed.exe
        working-directory: windows
        run: pyinstaller --noconfirm --distpath ..\dist --workpath ..\build PitchSpeed.spec
      - name: Smoke test
        shell: pwsh
        run: |
          .\dist\PitchSpeed\PitchSpeed.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\PitchSpeed\PitchSpeed.exe synth --help | Out-Null
      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md dist\PitchSpeed\README.md
          Copy-Item windows\READ_ME_FIRST.txt dist\PitchSpeed\READ_ME_FIRST.txt
          Compress-Archive -Path dist\PitchSpeed -DestinationPath PitchSpeed-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PitchSpeed-Windows
          path: PitchSpeed-Windows.zip
      - name: Publish download (release "latest-windows")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-windows
          name: Pitch Speed for Windows (latest build)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            Download PitchSpeed-Windows.zip, unzip it anywhere (for example Documents), then drag a
            video file onto PitchSpeed.exe inside the PitchSpeed folder. No Python needed.
            Built from ${{ github.sha }}.
          files: PitchSpeed-Windows.zip
